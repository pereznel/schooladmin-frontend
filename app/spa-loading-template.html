<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  #spa-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #f9fafb;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  .spa-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .spa-brand img {
    width: 44px;
    height: 44px;
    object-fit: contain;
  }

  .spa-brand-text {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #111827;
    line-height: 1.35;
  }

  .spa-dots {
    display: flex;
    gap: 7px;
  }

  .spa-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background-color: #DC2626;
    animation: spa-pulse 1.3s ease-in-out infinite;
  }

  .spa-dot:nth-child(2) { animation-delay: 0.18s; }
  .spa-dot:nth-child(3) { animation-delay: 0.36s; }

  @keyframes spa-pulse {
    0%, 70%, 100% {
      transform: scale(0.55);
      opacity: 0.35;
    }
    35% {
      transform: scale(1);
      opacity: 1;
    }
  }
</style>

<div id="spa-loader">
  <div class="spa-brand">
    <img src="/logo.png" alt="Logo" />
    <div class="spa-brand-text">Administrador<br>de curso</div>
  </div>
  <div class="spa-dots">
    <div class="spa-dot"></div>
    <div class="spa-dot"></div>
    <div class="spa-dot"></div>
  </div>
</div>
